    <link rel="stylesheet" href="stylesLBDC.css">

    <style>
        /* ========== REVIEW PAGE – IMPROVED ========== */
        .review-page {
          padding-bottom: 100px;
        }

        /* ---- HERO ---- */
        .review-hero {
          position: relative;
          padding: 48px 0 56px;
          border-bottom: 1px solid var(--border);
          overflow: hidden;
        }

        .review-hero::before {
          content: "";
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 90% 70% at 50% -30%, rgba(196, 30, 58, 0.18), transparent 55%),
            radial-gradient(ellipse 60% 50% at 85% 20%, rgba(212, 175, 55, 0.06), transparent 50%);
          pointer-events: none;
        }

        .review-hero-inner {
          position: relative;
          width: min(var(--max), calc(100% - 48px));
          margin: 0 auto;
        }

        .back-link {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 36px;
          color: var(--muted);
          font-size: 0.8rem;
          font-weight: 500;
          letter-spacing: 0.02em;
          transition: color 0.2s ease, gap 0.2s ease;
        }

        .back-link:hover,
        .back-link:focus-visible {
          color: #fff;
          gap: 12px;
        }

        .review-header {
          display: grid;
          grid-template-columns: 260px 1fr;
          gap: 52px;
          align-items: start;
        }

        /* Poster */
        .review-poster {
          position: relative;
          border-radius: 14px;
          overflow: hidden;
          border: 1px solid rgba(255,255,255,0.1);
          background: var(--surface);
          box-shadow:
            0 20px 50px -12px rgba(0,0,0,0.7),
            0 0 0 1px rgba(255,255,255,0.04);
          transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .review-poster:hover {
          transform: translateY(-4px);
          box-shadow:
            0 28px 60px -12px rgba(0,0,0,0.8),
            0 0 0 1px rgba(196, 30, 58, 0.25);
        }

        .review-poster img {
          width: 100%;
          aspect-ratio: 2 / 3;
          object-fit: cover;
          display: block;
        }

        .poster-placeholder {
          min-height: 360px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(145deg, #1a1a1e, #0d0d10);
          color: var(--muted);
          font-size: 0.85rem;
        }

        /* Info */
        .review-info h1 {
          font-family: 'Playfair Display', Georgia, serif;
          font-size: clamp(2.3rem, 5.2vw, 3.6rem);
          font-weight: 800;
          line-height: 1.05;
          letter-spacing: -0.03em;
          margin-bottom: 16px;
          color: #fff;
        }

        .review-meta {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 10px 14px;
          margin-bottom: 22px;
          color: var(--muted);
          font-size: 0.84rem;
          font-weight: 500;
        }

        .review-meta .dot {
          width: 3px;
          height: 3px;
          border-radius: 50%;
          background: var(--red);
          display: inline-block;
        }

        /* ---- GRIMORIO RATING BLOCK ---- */
        .grimorio-rating {
          display: flex;
          flex-direction: column;
          gap: 10px;
          margin-bottom: 26px;
          padding: 18px 20px;
          border-radius: 14px;
          background: linear-gradient(135deg, rgba(196, 30, 58, 0.09), rgba(212, 175, 55, 0.05));
          border: 1px solid rgba(255,255,255,0.08);
          position: relative;
          overflow: hidden;
        }

        .grimorio-rating::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          width: 4px;
          height: 100%;
          background: linear-gradient(to bottom, var(--gold), var(--red));
          border-radius: 4px 0 0 4px;
        }

        .grimorio-top {
          display: flex;
          align-items: center;
          gap: 14px;
          flex-wrap: wrap;
        }

        .grimorio-score {
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 2.1rem;
          font-weight: 800;
          color: var(--gold);
          line-height: 1;
          letter-spacing: -0.02em;
        }

        .grimorio-score small {
          font-size: 1rem;
          font-weight: 600;
          color: var(--muted);
          margin-left: 2px;
        }

        .grimorio-stars {
          display: flex;
          gap: 3px;
          font-size: 1.25rem;
          letter-spacing: 1px;
          color: var(--gold);
        }

        .grimorio-stars .empty {
          color: rgba(255,255,255,0.18);
        }

        .grimorio-stars .half {
          position: relative;
          color: rgba(255,255,255,0.18);
        }

        .grimorio-stars .half::after {
          content: "★";
          position: absolute;
          left: 0;
          top: 0;
          width: 50%;
          overflow: hidden;
          color: var(--gold);
        }

        .grimorio-title {
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 1.15rem;
          font-weight: 700;
          color: #fff;
          letter-spacing: 0.02em;
        }

        .grimorio-desc {
          font-size: 0.9rem;
          line-height: 1.55;
          color: var(--muted);
          margin: 0;
          max-width: 520px;
        }

        /* Platforms */
        .review-platforms {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-bottom: 28px;
        }

        .platform-tag {
          padding: 5px 13px;
          border-radius: 999px;
          background: rgba(255,255,255,0.04);
          border: 1px solid var(--border);
          font-size: 0.68rem;
          font-weight: 600;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          color: var(--muted);
        }

        /* Actions */
        .review-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
        }

        .btn-letterboxd {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 12px 20px;
          border-radius: 999px;
          background: #141414;
          border: 1px solid rgba(255,255,255,0.12);
          color: #fff;
          font-size: 0.8rem;
          font-weight: 600;
          transition: all 0.25s ease;
        }

        .btn-letterboxd:hover,
        .btn-letterboxd:focus-visible {
          background: #00e054;
          border-color: #00e054;
          color: #000;
          transform: translateY(-2px);
          box-shadow: 0 8px 24px -6px rgba(0, 224, 84, 0.4);
        }

        /* ---- BODY ---- */
        .review-body {
          width: min(720px, calc(100% - 48px));
          margin: 64px auto 0;
        }

        .review-body .lead {
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 1.4rem;
          line-height: 1.55;
          color: #e8e8ec;
          margin-bottom: 36px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }

        .review-body p {
          color: var(--muted);
          font-size: 1.07rem;
          line-height: 1.85;
          margin-bottom: 1.6rem;
        }

        .review-body blockquote {
          margin: 2.6rem 0;
          padding: 1.3rem 1.6rem;
          border-left: 3px solid var(--red);
          background: rgba(196, 30, 58, 0.07);
          border-radius: 0 14px 14px 0;
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 1.2rem;
          font-style: italic;
          color: #e8e8ec;
          line-height: 1.5;
          position: relative;
        }

        .review-body blockquote::before {
          content: "“";
          position: absolute;
          top: -8px;
          left: 12px;
          font-size: 3.5rem;
          color: rgba(196, 30, 58, 0.25);
          font-family: Georgia, serif;
          line-height: 1;
        }

        /* ---- VERDICT ---- */
        .verdict {
          margin-top: 3.8rem;
          padding: 30px 32px;
          border-radius: 16px;
          background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
          border: 1px solid rgba(255,255,255,0.08);
          box-shadow: 0 12px 40px -16px rgba(0,0,0,0.5);
          position: relative;
          overflow: hidden;
        }

        .verdict::before {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 80% 60% at 0% 0%, rgba(212, 175, 55, 0.08), transparent 60%);
          pointer-events: none;
        }

        .verdict-header {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 14px;
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 1.25rem;
          color: #fff;
          position: relative;
        }

        .verdict-header span {
          color: var(--gold);
          font-size: 1.15rem;
        }

        .verdict p {
          color: var(--muted);
          font-size: 1.05rem;
          line-height: 1.75;
          margin: 0;
          position: relative;
        }

        /* ---- NAV ---- */
        .review-nav {
          width: min(var(--max), calc(100% - 48px));
          margin: 80px auto 0;
          display: flex;
          justify-content: space-between;
          gap: 16px;
          flex-wrap: wrap;
        }

        .review-nav a {
          flex: 1;
          min-width: 180px;
          max-width: 300px;
          padding: 20px 22px;
          border-radius: 12px;
          background: var(--surface);
          border: 1px solid var(--border);
          transition: all 0.28s ease;
        }

        .review-nav a:hover,
        .review-nav a:focus-visible {
          border-color: rgba(196, 30, 58, 0.45);
          transform: translateY(-4px);
          box-shadow: 0 16px 36px -12px rgba(0,0,0,0.45);
        }

        .review-nav .label {
          display: block;
          font-size: 0.65rem;
          font-weight: 700;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--muted-2);
          margin-bottom: 7px;
        }

        .review-nav .title {
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 1.08rem;
          color: #fff;
          font-weight: 600;
        }

        .review-nav a:last-child {
          text-align: right;
          margin-left: auto;
        }

        /* States */
        .loading-state,
        .error-state {
          text-align: center;
          padding: 140px 20px;
          color: var(--muted);
          font-size: 1.15rem;
        }

        .error-state a {
          color: var(--red);
          text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 800px) {
          .review-header {
            grid-template-columns: 1fr;
            gap: 32px;
            text-align: center;
          }

          .review-poster {
            max-width: 240px;
            margin: 0 auto;
          }

          .review-meta,
          .review-platforms,
          .review-actions {
            justify-content: center;
          }

          .grimorio-rating {
            text-align: left;
          }

          .grimorio-top {
            justify-content: center;
          }

          .grimorio-desc {
            text-align: center;
            margin-left: auto;
            margin-right: auto;
          }

          .review-nav {
            flex-direction: column;
          }

          .review-nav a:last-child {
            text-align: left;
            margin-left: 0;
          }
        }

        .review-actions {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          margin-top: 18px;
          align-items: center;
        }

        .btn-letterboxd,
        .btn-share-wa {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          min-height: 44px;
          padding: 10px 18px;
          border-radius: 999px;
          font-size: 0.82rem;
          font-weight: 700;
          letter-spacing: 0.01em;
          text-decoration: none;
          border: 1px solid transparent;
          transition: background .2s ease, border-color .2s ease, transform .15s ease;
          line-height: 1.2;
          white-space: nowrap;
        }

        .btn-letterboxd:hover,
        .btn-share-wa:hover {
          transform: translateY(-1px);
        }

        /* Letterboxd — al estilo del sitio */
        .btn-letterboxd {
          background: rgba(255, 255, 255, 0.06);
          border-color: rgba(255, 255, 255, 0.14);
          color: #f0f0f2;
        }

        .btn-letterboxd:hover {
          background: rgba(255, 255, 255, 0.1);
          border-color: rgba(255, 255, 255, 0.22);
          color: #fff;
        }

        /* WhatsApp — mismo tamaño, color propio */
        .btn-share-wa {
          background: rgba(37, 211, 102, 0.12);
          border-color: rgba(37, 211, 102, 0.35);
          color: #3ddc81;
        }

        .btn-share-wa:hover {
          background: rgba(37, 211, 102, 0.2);
          border-color: rgba(37, 211, 102, 0.5);
          color: #5ce89a;
        }

        /* Modo claro */
        html[data-theme="light"] .btn-letterboxd {
          background: rgba(0, 0, 0, 0.04);
          border-color: rgba(0, 0, 0, 0.12);
          color: #121214;
        }

        html[data-theme="light"] .btn-letterboxd:hover {
          background: rgba(0, 0, 0, 0.07);
          color: #000;
        }

        html[data-theme="light"] .btn-share-wa {
          background: rgba(18, 140, 70, 0.1);
          border-color: rgba(18, 140, 70, 0.35);
          color: #128c46;
        }

        html[data-theme="light"] .btn-share-wa:hover {
          background: rgba(18, 140, 70, 0.16);
          color: #0b6b34;
        }

        @media (max-width: 480px) {
          .review-actions {
            flex-direction: column;
            align-items: stretch;
          }
          .btn-letterboxd,
          .btn-share-wa {
            width: 100%;
          }
        }

        .donde-barato {
          width: min(720px, calc(100% - 48px));
          margin: 36px auto 0;
          padding: 18px 20px;
          border-radius: 14px;
          border: 1px solid rgba(201, 162, 39, 0.22);
          background: rgba(201, 162, 39, 0.06);
        }
        .donde-barato h3 {
          font-family: 'Playfair Display', Georgia, serif;
          color: #fff;
          font-size: 1.15rem;
          margin: 0 0 8px;
        }
        .donde-barato p {
          margin: 0;
          color: var(--muted);
          font-size: 0.92rem;
          line-height: 1.6;
        }
        .donde-barato a {
          color: var(--gold);
          text-decoration: underline;
          text-underline-offset: 3px;
        }

        .related-reviews {
          width: min(var(--max), calc(100% - 48px));
          margin: 48px auto 0;
        }
        .related-reviews h3 {
          font-family: 'Playfair Display', Georgia, serif;
          color: #fff;
          font-size: 1.35rem;
          margin-bottom: 16px;
          text-align: center;
        }
        .related-grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: 12px;
        }
        @media (min-width: 600px) {
          .related-grid {
            grid-template-columns: repeat(3, 1fr);
          }
        }
        .related-card {
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding: 12px;
          border-radius: 12px;
          border: 1px solid var(--border);
          background: var(--surface);
          text-decoration: none;
          color: var(--text);
          transition: border-color .2s ease, transform .15s ease;
        }
        .related-card:hover {
          border-color: rgba(201, 162, 39, 0.35);
          transform: translateY(-2px);
        }
        .related-card img {
          width: 100%;
          aspect-ratio: 2 / 3;
          object-fit: cover;
          border-radius: 8px;
          background: var(--surface-2);
        }
        .related-title {
          font-weight: 700;
          font-size: 0.9rem;
          line-height: 1.3;
        }
        .related-card small {
          color: var(--gold);
          font-weight: 700;
        }

        html[data-theme="light"] .donde-barato h3,
        html[data-theme="light"] .related-reviews h3,
        html[data-theme="light"] .related-title {
          color: #121214;
        }
    </style>
    <script>
        try {
          var t = localStorage.getItem('lbdc-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
